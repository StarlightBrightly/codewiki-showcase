name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    env:
      VITE_APP_LOGO: https://codewiki-qn4bmd4p.manus.space/manus-storage/codewiki-mark_myu2b3hi.png
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 设置 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - name: 设置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 类型检查
        run: pnpm check
      - name: 运行测试
        run: pnpm test
      - name: 运行公开发布审计回归测试
        run: node --test scripts/audit-public-release.test.mjs
      - name: 构建项目
        run: pnpm build
